<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workouts · Activ-Ate</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/img/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="manifest" href="assets/site.webmanifest">
  <meta name="theme-color" content="#0E1814">
  <link rel="preload" href="assets/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/newsreader-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<a class="sr-only" href="#main">Skip to content</a>
<div class="app">
  <aside id="sidebar" class="sidebar"></aside>
  <main class="main" id="main">

    <div class="page-header"><div><h1>Workouts</h1><p class="lead">Log your sessions and see how your training develops.</p></div></div>
    <section class="kpis" id="kpis" aria-label="Key figures"><div class="skeleton" style="height:90px"></div><div class="skeleton" style="height:90px"></div><div class="skeleton" style="height:90px"></div><div class="skeleton" style="height:90px"></div></section>
    <div class="cols">
      <section class="card" style="flex:2 1 360px" id="log"><h2>Log a workout</h2><div id="form-host"></div></section>
      <div class="col-main" style="flex:3 1 440px">
        <section class="card">
          <div class="card-head"><h2>Exercise minutes per week</h2><span class="small muted"><span class="legend-dash"></span><span id="target-label">Target</span></span></div>
          <div id="weeks-chart"><div class="skeleton" style="height:210px"></div></div>
          <p class="small muted" id="weeks-note"></p>
        </section>
        <div class="cols">
          <section class="card" style="flex:1 1 240px"><h2>This week by sport</h2><div id="by-sport" class="stack"><div class="skeleton" style="height:80px"></div></div></section>
          <section class="card" style="flex:1 1 240px"><h2>Personal bests</h2><div id="pbs"><div class="skeleton" style="height:120px"></div></div></section>
        </div>
      </div>
    </div>
    <div class="cols">
      <section class="card col-main" style="gap:12px">
        <div class="card-head"><h2>History</h2><div class="chips" id="filters" role="group" aria-label="Filter by sport"></div></div>
        <div id="history"><div class="skeleton" style="height:200px"></div></div>
        <button type="button" class="btn" id="load-more" hidden>Load more</button>
      </section>
      <section class="card card--dark col-side" aria-live="polite">
        <div class="row"><span class="ai-badge"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M6 6l2 2M16 16l2 2M6 18l2-2M16 8l2-2"/></svg></span><h2>AI training insight</h2></div>
        <div id="ai-workout" class="stack"><div class="row muted"><span class="spinner"></span>Analysing your training…</div></div>
        <a class="btn btn--mint" href="coach.html?q=Build%20my%20training%20plan%20for%20next%20week" style="align-self:flex-start">Get my plan for next week</a>
      </section>
    </div>
  </main>
</div>
<script type="module" src="assets/js/pages/workouts.js"></script>
</body>
</html>
