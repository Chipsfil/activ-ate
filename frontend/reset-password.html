<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password · Activ-Ate</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<div class="auth">
  <main class="auth-main" style="flex:1">
    <form class="auth-card" id="reset-form" novalidate>
      <div class="stack" style="gap:8px">
        <h1>Choose a new password</h1>
        <p class="muted">Use at least 8 characters. After saving, you will be signed out on all devices.</p>
      </div>
      <div class="form-error" role="alert" hidden></div>
      <div class="field">
        <label for="new_password">New password</label>
        <div class="input-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
          <input class="input" id="new_password" name="new_password" type="password" autocomplete="new-password" minlength="8" required style="padding-right:48px">
          <button type="button" class="reveal" data-reveal="new_password" aria-label="Show password"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
      </div>
      <div class="field">
        <label for="confirm_password">Repeat new password</label>
        <input class="input" id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" required>
      </div>
      <button class="btn btn--primary btn--block" type="submit">Save new password</button>
      <a href="forgot-password.html" class="small" style="text-align:center">Request a new link</a>
    </form>
  </main>
</div>
<script type="module" src="assets/js/pages/reset-password.js"></script>
</body>
</html>
