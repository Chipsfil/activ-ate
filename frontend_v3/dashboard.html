<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · Activ-Ate</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/img/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="manifest" href="assets/site.webmanifest">
  <meta name="theme-color" content="#0B132B">
  <link rel="preload" href="assets/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<a class="sr-only" href="#main">Skip to content</a>
<div class="app">
  <aside id="sidebar" class="sidebar"></aside>
  <main class="main" id="main">

    <div class="page-header">
      <div>
        <div class="eyebrow" id="today-label">&nbsp;</div>
        <h1 id="greeting">Welcome</h1>
        <p class="lead" id="headline">&nbsp;</p>
      </div>
      <div class="row">
        <a class="btn" href="nutrition.html">Log meal</a>
        <button class="btn btn--primary" type="button" id="open-workout"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New workout</button>
      </div>
    </div>
    <section class="kpis" id="kpis" aria-label="Key figures"><div class="skeleton" style="height:110px"></div><div class="skeleton" style="height:110px"></div><div class="skeleton" style="height:110px"></div><div class="skeleton" style="height:110px"></div></section>
    <div class="cols">
      <div class="col-main">
        <section class="card"><div class="card-head"><h2>Activity this week</h2><span class="small muted">Minutes per day</span></div><div id="week-chart"><div class="skeleton" style="height:190px"></div></div></section>
        <section class="card"><div class="card-head"><h2>Weekly goals</h2><a href="goals.html">Edit goals</a></div><div class="stack" id="goal-list"><div class="skeleton" style="height:120px"></div></div></section>
        <section class="card" style="gap:4px"><div class="card-head" style="margin-bottom:8px"><h2>Recent workouts</h2><a href="workouts.html">View all</a></div><div id="recent"><div class="skeleton" style="height:160px"></div></div></section>
      </div>
      <div class="col-side">
        <section class="card card--dark" aria-live="polite">
          <div class="row"><span class="ai-badge"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M6 6l2 2M16 16l2 2M6 18l2-2M16 8l2-2"/></svg></span><h2>Today from your AI Coach</h2></div>
          <div id="ai-daily" class="stack"><div class="row muted"><span class="spinner"></span>Your coach is preparing today's advice…</div></div>
        </section>
        <section class="card">
          <div class="card-head"><h2>Daily check-in</h2><span class="small muted" id="checkin-date"></span></div>
          <form id="checkin" class="stack" novalidate>
            <div class="form-grid--2">
              <div class="field"><label for="sleep_hours">Sleep last night (h)</label><input class="input" id="sleep_hours" name="sleep_hours" type="number" step="0.5" min="0" max="16" inputmode="decimal"></div>
              <div class="field"><label for="water_l">Water today (L)</label><input class="input" id="water_l" name="water_l" type="number" step="0.1" min="0" max="10" inputmode="decimal"></div>
            </div>
            <div class="row-between"><div class="row" style="gap:6px"><button type="button" class="btn btn--small" data-water="0.25">+ 1 glass</button><button type="button" class="btn btn--small" data-water="0.5">+ 0.5 L</button></div><button class="btn btn--primary btn--small" type="submit">Save</button></div>
          </form>
        </section>
        <section class="card" style="gap:6px"><div class="card-head" style="margin-bottom:8px"><h2>Your network · exercise</h2><a href="community.html">Open</a></div><div id="network-top"><div class="skeleton" style="height:150px"></div></div><p class="small muted" id="network-note"></p></section>
        <section class="card"><h2>Network activity</h2><div id="feed" class="stack"><div class="skeleton" style="height:80px"></div></div></section>
      </div>
    </div>
  </main>
</div>
<dialog class="modal" id="workout-dialog" aria-labelledby="wd-title">
  <div class="modal-body">
    <div class="row-between"><h2 id="wd-title" style="font-family:var(--font-display);font-size:24px">New workout</h2><button class="btn btn--icon" type="button" id="close-workout" aria-label="Close">×</button></div>
    <div id="workout-form-host"></div>
  </div>
</dialog>
<script type="module" src="assets/js/pages/dashboard.js"></script>
</body>
</html>
