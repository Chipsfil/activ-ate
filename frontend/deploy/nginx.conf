# Activ-Ate – nginx site config for a Google Cloud VM (Debian/Ubuntu)
# Installed by deploy/setup-vm.sh to /etc/nginx/sites-available/activ-ate
# After adding a domain + HTTPS, certbot rewrites the listen lines automatically.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;                      # replace with your domain, e.g. activ-ate.example.com

    root /var/www/activ-ate;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Static pages – no caching of HTML so new deployments show up immediately
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }

    # JS/CSS/data – short cache (no build step / file hashing in this project)
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=300" always;
    }

    # Docs and deploy scripts are not needed by browsers
    location ~ ^/(docs|deploy)/ { deny all; }
    location ~ /\. { deny all; }

    # ---------------------------------------------------------------
    # Backend (enable when the FastAPI service runs on this VM).
    # Same origin → no CORS needed, refresh cookie works.
    # ---------------------------------------------------------------
    # location /api/ {
    #     proxy_pass         http://127.0.0.1:8000;
    #     proxy_http_version 1.1;
    #     proxy_set_header   Host              $host;
    #     proxy_set_header   X-Real-IP         $remote_addr;
    #     proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header   X-Forwarded-Proto $scheme;
    #     proxy_read_timeout 60s;               # AI endpoints can take a few seconds
    #     client_max_body_size 1m;
    # }
}
